name: probe
on: push
permissions: {}
jobs:
  collation:
    if: false
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "4.0"]
        variant: [main, fixed]
    runs-on: windows-latest
    steps:
      - run: |
          git config --system core.autocrlf false
          git config --system core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby-pkgs@2233d39c1315c667a2970436418b520a6300124e # v1.33.5
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          mingw: sqlite3
      - run: bundle exec rake compile -- --enable-system-libraries
      - if: matrix.variant == 'fixed'
        shell: bash
        run: cp probe/test_collation_fixed.rb test/test_collation.rb && git diff --stat
      - if: matrix.variant == 'main'
        name: in-process probe
        run: |
          bundle exec ruby -Ilib probe/collation_probe.rb same_thread 20000
          bundle exec ruby -Ilib probe/collation_probe.rb other_thread 20000
      - name: full suite, 30 runs
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 30); do
            bundle exec rake test > out.txt 2>&1 || { fails=$((fails+1)); grep -A3 "Failure:" out.txt; }
          done
          echo "${{ matrix.variant }}: full-suite failures $fails/30"

  busy:
    if: false
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        rep: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby-pkgs@2233d39c1315c667a2970436418b520a6300124e # v1.33.5
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          apt-get: libsqlite3-dev
      - run: bundle exec rake compile -- --disable-system-libraries
      - run: gcc -shared -fPIC -O2 -o /tmp/sleepshim.so probe/sleepshim.c -ldl
      - name: full suite, 10 runs, nanosleep EINTR shim
        run: |
          for i in $(seq 1 15); do
            LD_PRELOAD=/tmp/sleepshim.so bundle exec rake test TESTOPTS=-v > out.txt 2>&1 || true
            echo "== run $i: $(grep -E 'runs,' out.txt)"
            grep -E '^\[probe\]|^\[sleepshim\]|Failure:|Expected' out.txt | grep -v 'interrupted by signal 26' | head -40
            echo "   sleepshim lines: $(grep -c sleepshim out.txt || true), during busy test: $(sed -n '/test_busy_timeout begins/,/test_busy_timeout realtime/p' out.txt | grep -c sleepshim || true)"
            if sed -n '/test_busy_timeout begins/,/test_busy_timeout realtime/p' out.txt | grep -q sleepshim; then
              grep -n -B12 'test_busy_timeout begins' out.txt | grep -v 'signal 26'
              sed -n '/test_busy_timeout begins/,/test_busy_timeout realtime/p' out.txt | grep sleepshim | head -5
            fi
            echo "   SIGCHLD lines: $(grep -c 'signal 17' out.txt || true)"
          done

  pair:
    if: false
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.4"]
        variant: [main, fixed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby-pkgs@2233d39c1315c667a2970436418b520a6300124e # v1.33.5
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake compile -- --disable-system-libraries
      - run: gcc -shared -fPIC -O2 -o /tmp/sleepshim.so probe/sleepshim.c -ldl
      - if: matrix.variant == 'fixed'
        run: cp probe/test_discarding_fixed.rb test/test_discarding.rb && git diff --stat
      - name: a fork test, then test_busy_timeout, 60 times each
        run: |
          for t in test_fork_does_not_discard_readonly_connections test_fork_discards_an_open_readwrite_connection test_fork_does_not_discard_closed_connections; do
            LD_PRELOAD=/tmp/sleepshim.so bundle exec ruby -Ilib probe/pair.rb $t 60 > out.txt 2>&1 || true
            grep failed out.txt
            echo "  sleeps cut short by SIGCHLD: $(grep -c 'signal 17' out.txt || true), by SIGVTALRM: $(grep -c 'signal 26' out.txt || true)"
          done

  busy-alpine:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2"]
        rep: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v $PWD:/work -w /work ruby:${{ matrix.ruby }}-alpine3.19 sh -c '
            set -e
            apk add build-base >/dev/null
            bundle config set without development
            bundle install >/dev/null
            bundle exec rake compile -- --disable-system-libraries >/dev/null 2>&1
            gcc -shared -fPIC -O2 -o /tmp/sleepshim.so probe/sleepshim.c
            ruby -v
            for i in $(seq 1 12); do
              LD_PRELOAD=/tmp/sleepshim.so bundle exec rake test TESTOPTS=-v > out.txt 2>&1 || true
              echo "== run $i: $(grep -E "runs," out.txt)"
              grep -E "^\[probe\] test_busy_timeout realtime|Expected" out.txt || true
              if grep -q "test_busy_timeout realtime=0" out.txt; then grep -B10 "test_busy_timeout begins" out.txt; fi
              echo "   during busy test: $(sed -n "/test_busy_timeout begins/,/test_busy_timeout realtime/p" out.txt | grep sleepshim | sort | uniq -c | sed "s/ s unslept//" | head -5)"
              echo "   whole run: $(grep -o "interrupted by signal [0-9]*" out.txt | sort | uniq -c | tr "\n" " ")"
            done
          '
